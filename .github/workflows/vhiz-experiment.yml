name: vhiz experiment (temporary)
on:
  push:
    branches: [claude/vhiz-isolation-flake]
permissions:
  contents: read
jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun scripts/vhiz-experiment.ts race
  worktrees:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun scripts/vhiz-experiment.ts worktrees
