name: Quality
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test scripts --timeout 15000

  # The browser suite (tests/e2e). Its config starts the hearth and the
  # dashboard itself; see tests/e2e/AGENTS.md for what a green run does and
  # does not prove.
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      # The Playwright and Vite CLIs run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Keyed by what is installed (the headless shell only), so a change of
      # version or of install flags cannot hit a cache without the browser.
      - name: Cache the browser
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Install the browser and its system libraries
        if: steps.browser.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Install the browser's system libraries
        if: steps.browser.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      # Shorter than the job's limit: a hung suite then fails this step, rather
      # than the job being cancelled, and the upload below still runs.
      - name: Run the browser suite
        timeout-minutes: 12
        run: bun run verify:ui
      - name: Upload traces and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
