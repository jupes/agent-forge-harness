name: Quality
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
# The one place the Bun version is set. Every setup-bun step and every Bun
# download cache key read it, so a bump installs the new runtime and starts a
# fresh download cache together.
env:
  BUN_VERSION: 1.4.2
# A unique push group preserves even queued master runs: sharing a ref group
# can cancel a pending run even with cancel-in-progress disabled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    # A complete gate exceeded 15 minutes; bound all tests and cleanup with headroom.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The Linux jobs (this one and the three browser shards) share one key.
      # On a miss each tries to save it, one wins, and the others log a
      # harmless "unable to reserve cache" warning; the step still passes.
      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test ./scripts ./apps/desktop/src --timeout 15000

  # The unit gates again on Windows, where the owner and the command center
  # run: job objects, taskkill, owner-only ACLs and drive-letter paths only
  # take their Windows branches here. Lint is not repeated (the Linux job
  # covers it), and the browser suite stays Linux-only. Windows runners are
  # about twice as slow, hence the longer limit.
  windows:
    name: checks (windows)
    runs-on: windows-latest
    # Full home-isolation replay completed, but the still-progressing ordinary
    # suite reached 30 minutes. Preserve every test and its own deadline.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./scripts ./apps/desktop/src --timeout 15000
        env:
          AGENT_FORGE_TEST_PROBE_DIAGNOSTICS: "1"
          AGENT_FORGE_TEST_SDDL_ALIAS_RUNTIME: "pwsh-7"

  # The browser suites (tests/e2e and tests/desktop-e2e). Their configs start
  # the hearth and dashboard; see tests/e2e/AGENTS.md for the isolated fixtures
  # and what a green run does and does not prove.
  e2e:
    name: Playwright (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Match the locked @playwright/test version and avoid per-run apt/browser
    # downloads. The image contains browser binaries and system dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Git for protected checkpoint capture
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          timeout --kill-after=5s 60s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=30 update -qq
          timeout --kill-after=5s 90s apt-get install -y --no-install-recommends gcc make libc6-dev zlib1g-dev curl xz-utils
          git_prefix="$RUNNER_TEMP/forge-git"
          git_build="$RUNNER_TEMP/forge-git-source"
          git_archive="$RUNNER_TEMP/git-2.55.1.tar.xz"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --tlsv1.2 --max-time 60 --max-filesize 33554432 --output "$git_archive" https://www.kernel.org/pub/software/scm/git/git-2.55.1.tar.xz
          printf '%s  %s\n' '7bc345dba23c9089fa71bcf4e793d13d204fdc99b96abc118b3a29c18159eb16' "$git_archive" | sha256sum --check --strict
          mkdir -p "$git_build"
          tar -xJf "$git_archive" -C "$git_build" --strip-components=1 --no-same-owner
          timeout --kill-after=5s 180s make -C "$git_build" -j2 prefix="$git_prefix" NO_RUST=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_CURL=YesPlease NO_EXPAT=YesPlease NO_OPENSSL=YesPlease NO_PERL=YesPlease install
          test "$("$git_prefix/bin/git" --version)" = "git version 2.55.1"
          "$git_prefix/bin/git" --version
          "$git_prefix/bin/git" --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" --no-lazy-fetch --no-optional-locks --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c maintenance.auto=false -c gc.auto=0 rev-parse --verify --end-of-options 'HEAD^{commit}'
          "$git_prefix/bin/git" --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" --no-lazy-fetch --no-optional-locks --no-replace-objects -c core.hooksPath=/dev/null -c core.fsmonitor=false -c maintenance.auto=false -c gc.auto=0 rev-parse --verify --end-of-options 'HEAD^{tree}'
          printf '%s\n' "$git_prefix/bin" >> "$GITHUB_PATH"
      # The Playwright and Vite CLIs run on Node. Install Bun's official
      # platform package through npm to avoid an unrelated apt/unzip dependency.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned Bun platform package
        timeout-minutes: 2
        run: |
          npm install --prefix "$RUNNER_TEMP/forge-bun" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --strict-ssl=true "@oven/bun-linux-x64@${BUN_VERSION}"
          mkdir -p "$RUNNER_TEMP/forge-bun/bin"
          ln -s ../node_modules/@oven/bun-linux-x64/bin/bun "$RUNNER_TEMP/forge-bun/bin/bun"
          ln -s bun "$RUNNER_TEMP/forge-bun/bin/bunx"
          test "$("$RUNNER_TEMP/forge-bun/bin/bun" --version)" = "$BUN_VERSION"
          echo "$RUNNER_TEMP/forge-bun/bin" >> "$GITHUB_PATH"
      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Verify installed Playwright matches browser image
        run: test "$(bunx playwright --version | awk '{print $2}')" = "1.63.0"
      # Shorter than the job's limit. The intent: a hung suite fails this step,
      # rather than the job being cancelled, so the upload below still runs.
      - name: Run the browser suite
        timeout-minutes: 12
        run: bun run verify:ui -- --shard=${{ matrix.shard }}/3
      - name: Upload traces and failure screenshots
        # Desktop renderer uses the same isolated servers in a separate run.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
      # Each isolated matrix job runs its disjoint desktop test shard. The
      # complete suite stays required; worker/test concurrency remains serial.
      - name: Run desktop browser journey shard
        timeout-minutes: 12
        run: bun run verify:desktop -- --shard=${{ matrix.shard }}/3
      - name: Upload desktop traces and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
      # Upload only the controlled visualization fixtures; no local GUI capture is required.
      - name: Upload Beads work-map screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beads-work-map-${{ matrix.shard }}
          path: test-results/work-map-evidence/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Hearth log screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearth-log-${{ matrix.shard }}
          path: test-results/hearth-log-evidence/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Qualify MCP integration UI negative controls
        if: matrix.shard == 1
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p .tmp/work/mcp-ui-negative
          set +e
          FORGE_MCP_UI_NEGATIVE_CONTROL=1 PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/.tmp/work/mcp-ui-negative/report.json" node node_modules/@playwright/test/cli.js test --config playwright.desktop.config.ts tests/desktop-e2e/app-integrations.spec.ts --reporter=json --timeout=20000 --output=test-results/mcp-negative
          integration_status=$?
          set -e
          bun scripts/desktop/mcp-ui-negative-report.ts "$integration_status" .tmp/work/mcp-ui-negative/report.json
      - name: Upload MCP integration screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-integrations-${{ matrix.shard }}
          path: |
            .tmp/screenshots/integrations/*.png
            .tmp/work/mcp-ui-negative/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload native update review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-updates-${{ matrix.shard }}
          path: .tmp/screenshots/updates/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Run desktop temporary Git worktree journey
        if: matrix.shard == 1
        timeout-minutes: 4
        run: bun run verify:desktop-worktrees
      - name: Upload desktop worktree traces and failure screenshots
        if: failure() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: desktop-worktree-playwright-test-results
          path: test-results-desktop-worktrees/
          retention-days: 14
      - name: Run actual attended project shift journeys
        if: matrix.shard == 1
        timeout-minutes: 6
        run: bun run verify:desktop-shifts
      - name: Upload attended project shift traces and failure screenshots
        if: failure() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shift-playwright-test-results
          path: test-results/desktop-shifts/
          retention-days: 14
      - name: Run desktop original Start recovery after an owned hearth restart
        if: matrix.shard == 1
        timeout-minutes: 4
        run: bun run verify:desktop-restart
      - name: Upload desktop restart traces and failure screenshots
        if: failure() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: desktop-restart-playwright-test-results
          path: test-results-desktop-restart/
          retention-days: 14

  # Stable name for branch protection; skipped/cancelled shards must fail it.
  playwright:
    name: Playwright
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "${{ needs.e2e.result }}" = "success"
