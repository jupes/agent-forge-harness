name: Quality
on:
  pull_request:
  push:
    branches: [master, main]
permissions:
  contents: read
# The one place the Bun version is set. Every setup-bun step and every Bun
# download cache key read it, so a bump installs the new runtime and starts a
# fresh download cache together.
env:
  BUN_VERSION: 1.4.2
# A unique push group preserves even queued master runs: sharing a ref group
# can cancel a pending run even with cancel-in-progress disabled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    # Full units can pass near ten minutes; keep setup and cleanup within the job budget.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The Linux jobs (this one and the three browser shards) share one key.
      # On a miss each tries to save it, one wins, and the others log a
      # harmless "unable to reserve cache" warning; the step still passes.
      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test scripts --timeout 15000

  # The unit gates again on Windows, where the owner and the command center
  # run: job objects, taskkill, owner-only ACLs and drive-letter paths only
  # take their Windows branches here. Lint is not repeated (the Linux job
  # covers it), and the browser suite stays Linux-only. Windows runners are
  # about twice as slow, hence the longer limit.
  windows:
    name: checks (windows)
    runs-on: windows-latest
    # A complete Windows gate exceeded the 25-minute job limit after 21m49s of
    # Bun work plus setup and cleanup; leave bounded headroom for the full gate.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test scripts --timeout 15000
        env:
          AGENT_FORGE_TEST_PROBE_DIAGNOSTICS: "1"

  # The browser suites (tests/e2e and tests/desktop-e2e). Their configs start
  # the hearth and dashboard; see tests/e2e/AGENTS.md for the isolated fixtures
  # and what a green run does and does not prove.
  e2e:
    name: Playwright (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Match the locked @playwright/test version and avoid per-run apt/browser
    # downloads. The image contains browser binaries and system dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install unzip required by setup-bun
        timeout-minutes: 2
        run: |
          apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The Playwright and Vite CLIs run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Verify installed Playwright matches browser image
        run: test "$(bunx playwright --version | awk '{print $2}')" = "1.63.0"
      # Shorter than the job's limit. The intent: a hung suite fails this step,
      # rather than the job being cancelled, so the upload below still runs.
      - name: Run the browser suite
        timeout-minutes: 12
        run: bun run verify:ui -- --shard=${{ matrix.shard }}/3
      - name: Upload traces and failure screenshots
        # Desktop renderer uses the same isolated servers in a separate run.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
      # Each isolated matrix job runs its disjoint desktop test shard. The
      # complete suite stays required; worker/test concurrency remains serial.
      - name: Run desktop browser journey shard
        timeout-minutes: 12
        run: bun run verify:desktop -- --shard=${{ matrix.shard }}/3
      - name: Upload desktop traces and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
      - name: Run desktop temporary Git worktree journey
        if: matrix.shard == 1
        timeout-minutes: 4
        run: bun run verify:desktop-worktrees
      - name: Upload desktop worktree traces and failure screenshots
        if: failure() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: desktop-worktree-playwright-test-results
          path: test-results-desktop-worktrees/
          retention-days: 14
      - name: Run actual attended project shift journeys
        if: matrix.shard == 1
        timeout-minutes: 6
        run: bun run verify:desktop-shifts
      - name: Upload attended project shift traces and failure screenshots
        if: failure() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: desktop-shift-playwright-test-results
          path: test-results/desktop-shifts/
          retention-days: 14
      - name: Run desktop original Start recovery after an owned hearth restart
        if: matrix.shard == 1
        timeout-minutes: 4
        run: bun run verify:desktop-restart
      - name: Upload desktop restart traces and failure screenshots
        if: failure() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: desktop-restart-playwright-test-results
          path: test-results-desktop-restart/
          retention-days: 14

  # Stable name for branch protection; skipped/cancelled shards must fail it.
  playwright:
    name: Playwright
    needs: e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: test "${{ needs.e2e.result }}" = "success"
