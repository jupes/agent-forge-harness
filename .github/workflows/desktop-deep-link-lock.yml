name: Desktop deep-link dependency proposal

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  propose-lock:
    if: github.event.pull_request.number == 507 && github.event.pull_request.head.repo.full_name == github.repository && github.event.label.name == 'desktop-deep-link-lock-proposal'
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.99.1-x86_64-pc-windows-msvc
      PROPOSAL_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Resolve a bounded dependency proposal without building or launching
        timeout-minutes: 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path '.tmp/deep-link-lock-proposal' -Force | Out-Null
          @'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          const hash = text => crypto.createHash('sha256').update(text).digest('hex');
          const command = async args => {
            const child = Bun.spawn(args, { stdout: 'pipe', stderr: 'pipe' });
            const [out, error, code] = await Promise.all([new Response(child.stdout).text(), new Response(child.stderr).text(), child.exited]);
            if (code !== 0) throw Error('Dependency proposal command failed: ' + error);
            return out.trim();
          };
          const head = await command(['git', 'rev-parse', 'HEAD']);
          if (head !== process.env.PROPOSAL_SOURCE_SHA) throw Error('Source mismatch');
          const tree = await command(['git', 'rev-parse', 'HEAD^{tree}']);
          if (await command(['bun', '--version']) !== '1.4.2') throw Error('Bun mismatch');
          if (!(await command(['cargo', '--version'])).startsWith('cargo 1.99.1 ')) throw Error('Cargo mismatch');
          const manifestPath = 'apps/desktop/src-tauri/Cargo.toml';
          const lockPath = 'apps/desktop/src-tauri/Cargo.lock';
          const manifest = await fs.readFile(manifestPath, 'utf8');
          const lock = await fs.readFile(lockPath, 'utf8');
          const marker = 'tauri-plugin-shell = "=2.3.6"';
          if (manifest.split(marker).length !== 2 || manifest.includes('tauri-plugin-deep-link')) throw Error('Manifest baseline changed');
          const additions = [
            'tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }',
            'tauri-plugin-deep-link = "=2.6.3"',
          ];
          const nextManifest = manifest.replace(marker, marker + '\n' + additions.join('\n'));
          const lines = value => value.replaceAll('\r\n', '\n').split('\n').filter(line => line.trim());
          const positive = (before, after) => {
            const a = lines(before), b = lines(after), positions = new Map(), tails = [];
            for (let j = 0; j < b.length; j++) { let p = positions.get(b[j]); if (!p) positions.set(b[j], p = []); p.push(j); }
            for (const line of a) { const matches = positions.get(line); if (!matches) continue; for (let k = matches.length - 1; k >= 0; k--) { const value = matches[k]; let lo = 0, hi = tails.length; while (lo < hi) { const mid = (lo + hi) >>> 1; if (tails[mid] < value) lo = mid + 1; else hi = mid; } tails[lo] = value; } }
            return b.length - tails.length;
          };
          const registry = 'registry+https://github.com/rust-lang/crates.io-index';
          const identity = item => item.name + '@' + item.version + '|' + (item.source ?? '');
          try {
            await fs.writeFile(manifestPath, nextManifest);
            await command(['cargo', 'update', '--workspace', '--manifest-path', manifestPath]);
            const proposed = await fs.readFile(lockPath, 'utf8');
            const added = positive(lock, proposed), manifestAdded = positive(manifest, nextManifest);
            if (Buffer.byteLength(proposed) > 1048576 || added > 8000 || manifestAdded > 10) throw Error('Proposal exceeds source bounds');
            const before = Bun.TOML.parse(lock).package, after = Bun.TOML.parse(proposed).package;
            const prior = new Map(before.map(item => [identity(item), item]));
            const result = new Map(after.map(item => [identity(item), item]));
            if (result.size !== after.length) throw Error('Duplicate package identity');
            for (const [key, item] of prior) if (!result.has(key) || result.get(key).checksum !== item.checksum) throw Error('Existing locked identity changed');
            for (const item of after) if (item.source && item.source !== registry) throw Error('Unexpected remote package source');
            const pins = [
              ['tauri-plugin-single-instance', '2.5.5', '726b6da0dd5bd1344f84f4108a622c07d01923baacb5c803a605189672c5352f'],
              ['tauri-plugin-deep-link', '2.6.3', 'ab551d9bec27bb79d1c7fe5ed38c5cfd1cebb86efa745acc65f5853f345f6e56'],
            ];
            for (const [name, version, checksum] of pins) if (!after.some(item => item.name === name && item.version === version && item.checksum === checksum)) throw Error('Pinned plugin checksum mismatch');
            const dir = '.tmp/deep-link-lock-proposal/output';
            await fs.mkdir(dir, { recursive: true });
            await fs.writeFile(dir + '/Cargo.toml', nextManifest);
            await fs.writeFile(dir + '/Cargo.lock', proposed);
            const proof = { version: 1, sourceCommit: head, sourceTree: tree, baseManifestSha256: hash(manifest), baseLockSha256: hash(lock), proposedManifestSha256: hash(nextManifest), proposedLockSha256: hash(proposed), manifestAddedNonblank: manifestAdded, lockAddedNonblank: added, oldIdentitiesPreserved: true, newPackages: after.filter(item => !prior.has(identity(item))).map(item => ({ name: item.name, version: item.version, checksum: item.checksum })), nativeAppLaunched: false, compiled: false };
            await fs.writeFile(dir + '/PROPOSAL.json', JSON.stringify(proof, null, 2) + '\n');
            console.log(JSON.stringify(proof));
          } finally {
            await fs.writeFile(manifestPath, manifest);
            await fs.writeFile(lockPath, lock);
          }
          '@ | Set-Content -LiteralPath '.tmp/deep-link-lock-proposal/resolve.mjs' -Encoding utf8NoBOM
          bun run .tmp/deep-link-lock-proposal/resolve.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Dependency proposal failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-deep-link-lock-${{ github.event.pull_request.head.sha }}
          path: .tmp/deep-link-lock-proposal/output/
          if-no-files-found: error
          retention-days: 7
