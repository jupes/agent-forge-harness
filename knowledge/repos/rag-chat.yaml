overview:
  name: rag-chat
  description: >
    A D&D 5e Retrieval-Augmented-Generation chat app. Users ask about spells,
    monsters, rules, and lore; the "Sage" answers ONLY from the ingested rulebook
    corpus (9,070 chunks across 12 5E books in pgvector), with citations, and
    refuses out-of-corpus questions instead of hallucinating. Three layers: a
    React/Vite UI, a stateless FastAPI agent service (POST /chat), and a
    PostgreSQL+pgvector store, plus an offline ingestion/extraction/eval pipeline.
  purpose: full-stack app (frontend + backend + vector DB + data pipeline)
  remote: https://github.com/jupes/rag-chat  (work lands on master)
  tech_stack:
    runtime: python 3.12 (run via `uv run`); bun for the UI
    framework: FastAPI (service); React 19 + Vite 8 (ui)
    language: python + typescript (strict)
    datastore: PostgreSQL 17 + pgvector (HNSW cosine + GIN FTS)
    models:
      - text-embedding-3-small — 1536-d query/chunk embeddings (OpenAI)
      - gpt-4o-mini — grounded answer generation (OpenAI)
      - cross-encoder (sentence-transformers, CPU, lazy) — gated reranker, off by default
    key_libraries:
      - "psycopg[binary]": pg driver (per-request connect)
      - openai: embeddings + generation
      - pymupdf (fitz): default PDF reader engine for extraction
      - pdfplumber: alternate engine (mm-5e)
      - vitest + @testing-library/react + jsdom: UI tests
      - "react 19.2, vite 8, typescript ~6.0, @vitejs/plugin-react"

architecture:
  structure: |
    ingestion/    offline pipeline: extract -> QA gate -> embed; retrieval core; eval
    service/      FastAPI app: POST /chat (retrieve -> gate -> generate -> cite)
    ui/           React+Vite chat SPA (dark "grimoire" theme)
    vector-db/    pgvector init SQL + verify_db.py smoke test
    docker-compose.yml + Dockerfile.service + ui/Dockerfile + ui/nginx.conf
  entry_points:
    - 'service/app.py — `uvicorn service.app:app --port 8000`; FastAPI, lifespan builds RagService once'
    - 'ui/src/main.tsx — Vite SPA root; dev proxy /chat + /healthz to port 8000'
    - 'ingestion/extract_scan.py — `python ingestion/extract_scan.py <pdf> --book-slug <slug>`; PDF to chunks JSONL'
    - 'ingestion/embed.py — `python ingestion/embed.py --chunks <jsonl> [--replace-book]`; embed + upsert into pgvector'
    - 'ingestion/eval_golden.py — golden-set retrieval eval (Hit@1 / MRR / Recall@10)'
  key_components:
    - 'RagRetriever (ingestion/retrieval.py) — shared query->chunks core used by BOTH eval and service'
    - 'RagService (service/rag.py) — retrieve, answerability gate, generate, cite'
    - 'extract_supplement_chunks (ingestion/extract_scan.py:584) — anchor-driven mixed-content extractor (PHB/XGE/TCE/SCAG/Ravnica/Eberron)'
    - 'extract_mm_chunks (ingestion/extract_scan.py:249) — two-pass Monster Manual extractor (_assign_anchor_owners)'
    - 'detect_collapse (ingestion/qa_chunks.py) — corpus-wide regression guard (multi stat-anchor under one entity)'

patterns:
  extraction: >
    OCR-scanned PDFs -> LineItem stream (group_spans_to_lines) -> per-book extractor by
    cfg["kind"] (monster_manual | dmg | supplement). Anchor-driven: spells anchor on a
    "Nth-level <school>"/"<school> cantrip" line (OCR-fuzzy) or a "Casting Time:" fallback;
    monsters on "Armor Class N"; the entity name is recovered from nearby heading/name lines.
    ocr_normalize.normalize_ocr() cleans the phb-5e scan's garbled text (no-op on clean books).
  retrieval: >
    Embed query -> detect class/entity/content_type hints vs corpus vocabulary (with a
    generic-entity stoplist + stemmed ILIKE) -> filtered vector search -> optional gated
    cross-encoder rerank (prose only) -> answerability gate by top-1 cosine distance
    (KOZ_ANSWERABLE_DISTANCE = 0.50). Shared by eval + service via ingestion/retrieval.py.
  generation: >
    Grounded: build context from FULL chunk text (not the 120-char preview), prompt
    gpt-4o-mini to answer only from numbered sources and cite [n]; out-of-corpus ->
    fixed refusal, no LLM call.
  pre_embedding_qa: >
    qa_chunks.py quarantines bad chunks BEFORE embedding (cid markers, PUA/control ratio,
    low alpha, length, bad/field/sentence entity_names) and detect_collapse flags merged
    entities. Run extract -> qa (clean/quarantine split) -> embed the .clean.jsonl.
  error_handling: >
    Service: 422 empty prompt (pydantic min_length=1), 503 not-ready/upstream, 200 +
    answerable=false for refusals (NOT an error). UI: discriminated ChatResult ok|error.
  module_organization: >
    ingestion modules are flat + import-by-filename (scripts run with their dir on sys.path);
    service is a package (relative imports, service/__init__.py); ui is standard Vite src/.
  testing: >
    Python: self-contained `_run()` runners, no pytest — `uv run python ingestion/test_*.py`
    and `service/test_*.py` (pure; no DB/LLM — retriever + LLM mocked). UI: `bunx vitest run`
    + `bunx tsc --noEmit`. Golden retrieval eval is ingestion/eval_golden.py (live DB).

conventions:
  commit_format: "<type>(<scope>): <description>  (Refs: <beads-id>)"
  run_python: "use `uv run python ...` (bare python is a Windows Store stub here); DB/LLM/embed need --with \"psycopg[binary]\" --with openai (and --with pymupdf for extraction)"
  windows_note: "force UTF-8 for eval (PYTHONUTF8=1) — it prints box-drawing chars"
  coding_standards:
    - TypeScript strict; no `any` without justification
    - chunk_id = sha256(book_slug:page:col:idx)[:20] — NOT stable across re-extraction (idx is extraction-order)

integration_points:
  apis:
    - endpoint: /chat
      method: POST
      request: "ChatRequest { prompt: str (min_length=1) }"
      response: "ChatResponse { answer: str, sources: Source[], answerable: bool }"
      notes: "Source = {book, chapter?, section?, entity?, page?, snippet}. Refusal = 200 + answerable=false + []."
    - endpoint: /healthz
      method: GET
      response: "{ status: 'ok', ready: 'True'|'False' }"
  shared_types:
    - name: ChatResponse / Source
      file: service/models.py
      consumers: [ui/src/api.ts (mirrored exactly)]
  internal_contracts:
    - RetrievalResult / RetrievedChunk: ingestion/retrieval.py — returned by RagRetriever.retrieve(); consumed by service/generate.py + eval
  prod_serving: >
    Single uvicorn can serve UI+API: `cd ui && bun run build` then app.py mounts ui/dist via
    guarded StaticFiles after the route decorators. Docker compose runs vector-db + service + ui
    (nginx) — one `docker compose up --build`, UI at http://localhost:5173.

db_schema:
  table: dnd.chunks
  columns: "chunk_id PK, book_slug, source_file, page_start/end, part/chapter/section, content_type, entity_name, class_name, feature_name, text, embedding vector(1536), search_vector tsvector, created_at"
  content_types: [rule, monster, dm_guidance, spell, magic_item, feat]
  indexes: "HNSW (vector_cosine_ops) for ANN cosine; GIN on search_vector for FTS"
  functions: "dnd.hybrid_search(query_embedding, query_text, k) — vector + FTS fused via RRF (k=60); built, not used by default retrieval (see bead 3q3)"
  init: "vector-db/init/01-extensions.sql, 02-schema.sql (table+indexes), 03-hybrid-search.sql (function)"

key_files:
  - path: ingestion/extract_scan.py
    description: OCR-scan PDF -> chunks. Per-book extractors, OCR-fuzzy spell anchors + casting-time fallback + name-size exemption, junk-name rejection, monster owner-assignment.
    key_exports: ["extract_supplement_chunks", "extract_mm_chunks", "_assign_anchor_owners", "is_spell_anchor/is_casting_time", "classify_content_type"]
  - path: ingestion/retrieval.py
    description: Shared retrieval core (RagRetriever) — embed, filter, vector search, gate, rerank. Used by eval AND service.
    key_exports: ["RagRetriever.retrieve", "is_answerable (0.50)", "extract_query_entities", "fetch_chunk_details"]
  - path: ingestion/qa_chunks.py
    description: Pre-embedding QA gate + corpus collapse detector. CLI `--collapse-check [--from-db]`.
    key_exports: ["classify_chunk", "entity_name_ok", "detect_collapse", "run_qa"]
  - path: ingestion/ocr_normalize.py
    description: Rule-based OCR cleanup for the phb-5e scan (capital-I->l token rule + curated non-word dict). No-op on clean books.
    key_exports: ["normalize_ocr"]
  - path: ingestion/embed.py
    description: Embed chunks (OpenAI/Ollama) + upsert into pgvector. `--replace-book` deletes a book's rows first (no orphans on re-extract).
    key_exports: ["embed_and_upsert"]
  - path: service/app.py
    description: FastAPI — POST /chat + GET /healthz; RagService built once at startup; guarded ui/dist StaticFiles mount.
  - path: service/rag.py
    description: RagService.answer(prompt) -> ChatResponse — orchestrates retrieve -> koz gate -> generate -> cite.
  - path: service/generate.py
    description: build_context (full text) / build_sources (deduped) / generate_answer (gpt-4o-mini, injectable client).
  - path: ui/src/api.ts
    description: Typed client mirroring service/models.py; postChat -> discriminated ChatResult (200/422/503/network).
  - path: ui/src/useChat.ts
    description: Client-side exchange-list hook (service is stateless); one in-flight request, no double-submit.
  - path: ingestion/golden_entities.json
    description: Canonical entities (15 spells + 3 monsters) that MUST extract correctly — regression guard (test_golden_entities.py).

