[package]
name = "agent-forge-desktop"
version = "1.0.0-rc.1"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
toml = "=1.1.8+spec-1.1.0"
sha2 = "=0.10.9"
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "tray-icon"] }
tauri-plugin-shell = "=2.3.6"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "stream"] }
tokio = { version = "=1.54.0", features = ["sync"] }
semver = "=1.0.28"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-deep-link = "=2.6.3"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell"] }
