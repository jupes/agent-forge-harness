[package]
name = "agent-forge-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tauri = { version = "=2.12.4", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl"] }
tauri-plugin-shell = "=2.3.6"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }
